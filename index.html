<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="CHIPQUEST: The Laptop Trial - An 8-bit pixel RPG about choosing the right AI PC">
  <meta name="theme-color" content="#0F1020">
  <title>CHIPQUEST: The Laptop Trial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body oncontextmenu="return false">
  <!-- Loading screen -->
  <div id="loading">LOADING...</div>

  <!-- Rotate device overlay (section 3.3) -->
  <div id="rotate-overlay">
    <div class="rotate-icon">📱↔️</div>
    <p>ROTATE DEVICE</p>
    <p>Play in landscape mode</p>
  </div>

  <!-- Game canvas -->
  <canvas id="game"></canvas>

  <!-- Touch controls (section 3.3, shown only on touch) -->
  <div id="touch-controls">
    <div id="dpad">
      <div class="dpad-btn dpad-up">▲</div>
      <div class="dpad-btn dpad-down">▼</div>
      <div class="dpad-btn dpad-left">◄</div>
      <div class="dpad-btn dpad-right">►</div>
      <div class="dpad-center"></div>
    </div>
    <div class="action-buttons">
      <button id="btn-b" class="action-btn">B</button>
      <button id="btn-a" class="action-btn">A</button>
    </div>
  </div>

  <!-- Mute button -->
  <button id="btn-mute">🔊</button>

  <!-- Pause button (shown during gameplay; Esc also pauses) -->
  <button id="btn-pause" title="Pause (Esc)" style="display:none">⏸</button>

  <!-- Fullscreen button (section 12) -->
  <button id="btn-fullscreen" title="Fullscreen">⛶</button>

  <!-- Pokemon-style player character & name prompt modal -->
  <div id="name-modal" class="hidden" role="dialog" aria-modal="true" aria-label="Choose trainer appearance and name">
    <div id="name-card">
      <div id="name-title">TRAINER CARD</div>
      <div id="name-sub">Are you a boy or a girl? And what's your name?</div>
      <div id="gender-row" role="radiogroup" aria-label="Choose boy or girl">
        <button type="button" class="gender-btn selected" data-gender="boy"><canvas class="gender-prev" width="32" height="32"></canvas><span>BOY</span></button>
        <button type="button" class="gender-btn" data-gender="girl"><canvas class="gender-prev" width="32" height="32"></canvas><span>GIRL</span></button>
      </div>
      <input id="name-input" type="text" maxlength="10" placeholder="ASH" autocomplete="off" spellcheck="false" />
      <div id="name-presets">
        <button type="button" class="name-preset" data-name="ASH">ASH</button>
        <button type="button" class="name-preset" data-name="RED">RED</button>
        <button type="button" class="name-preset" data-name="KAI">KAI</button>
      </div>
      <button id="name-ok" type="button">OK</button>
    </div>
  </div>

  <script>
    // Fullscreen toggle (section 12)
    const fsBtn = document.getElementById('btn-fullscreen');
    if (!document.fullscreenEnabled && !document.webkitFullscreenEnabled) {
      fsBtn.style.display = 'none';
    }
    fsBtn.addEventListener('click', () => {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        const el = document.documentElement;
        (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      }
    });

    // Prevent default on touch events
    document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  </script>

  <!-- Catch module/runtime load errors without hiding actual errors -->
  <script>
    window.addEventListener('error', e => {
      console.error('GLOBAL ERROR:', e.message, e.filename, e.lineno);
      const ld = document.getElementById('loading');
      if (ld) {
        ld.style.display = 'flex';
        ld.textContent = 'ERROR: ' + e.message;
      }
    });
    window.addEventListener('unhandledrejection', e => {
      console.error('UNHANDLED REJECTION:', e.reason);
      const ld = document.getElementById('loading');
      if (ld) {
        ld.style.display = 'flex';
        ld.textContent = 'ERROR: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
      }
    });
  </script>

  <!-- Main entry -->
  <script type="module" src="./js/core/main.js"></script>
</body>
</html>
